name: Build module

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test module packaging
        shell: pwsh
        run: ./tests/test-package.ps1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          & sdkmanager.bat --channel=3 'platforms;android-36.1' 'build-tools;37.0.0' 'ndk;29.0.14206865'
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager failed' }

      - name: Build Zygisk module
        shell: pwsh
        run: |
          $ndkPath = Join-Path $env:ANDROID_SDK_ROOT 'ndk\29.0.14206865'
          ./build.ps1 -NdkPath $ndkPath

      - name: Verify module ZIP
        shell: pwsh
        run: |
          . ./scripts/module-package.ps1
          $zip = @(Get-ChildItem -LiteralPath build -Filter 'cts-share-zygisk-v*.zip' -File)
          if ($zip.Count -ne 1) { throw "Expected one module ZIP, found $($zip.Count)" }
          Assert-ModulePackage $zip[0].FullName

      - uses: actions/upload-artifact@v7
        with:
          path: build/cts-share-zygisk-v*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  installer-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cts-share-zygisk-v*.zip
          path: artifact
          merge-multiple: true
          skip-decompress: true
      - name: Test packaged installer on Linux
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y busybox
          zip=(artifact/cts-share-zygisk-v*.zip)
          test "${#zip[@]}" -eq 1
          test -f "${zip[0]}"
          directory=$(mktemp -d)
          trap 'rm -rf -- "$directory"' EXIT
          unzip -p "${zip[0]}" customize.sh > "$directory/customize.sh"
          busybox ash -n "$directory/customize.sh"
          busybox ash tests/test-customize.sh "$directory/customize.sh"
