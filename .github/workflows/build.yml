name: Build module

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          & sdkmanager.bat --channel=3 'platforms;android-36.1' 'build-tools;37.0.0' 'ndk;29.0.14206865'
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager failed' }

      - name: Build Zygisk module
        shell: pwsh
        run: |
          $ndkPath = Join-Path $env:ANDROID_SDK_ROOT 'ndk\29.0.14206865'
          ./build.ps1 -NdkPath $ndkPath

      - name: Verify module ZIP
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          $zip = @(Get-ChildItem -LiteralPath build -Filter 'cts-share-zygisk-v*.zip' -File)
          if ($zip.Count -ne 1) { throw "Expected one module ZIP, found $($zip.Count)" }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip[0].FullName)
          try {
            $entries = @{}
            foreach ($entry in $archive.Entries) { $entries[$entry.FullName] = $entry.Length }
            foreach ($required in @('module.prop', 'helper.dex', 'customize.sh', 'skip_mount', 'zygisk/arm64-v8a.so')) {
              if (-not $entries.ContainsKey($required)) { throw "Missing $required in module ZIP" }
            }
            if ($entries['helper.dex'] -le 0 -or $entries['zygisk/arm64-v8a.so'] -le 0) {
              throw 'Dex or Zygisk library is empty'
            }
          } finally {
            $archive.Dispose()
          }

      - uses: actions/upload-artifact@v7
        with:
          path: build/cts-share-zygisk-v*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
